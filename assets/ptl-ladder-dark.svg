<svg xmlns="http://www.w3.org/2000/svg" width="418" height="250" viewBox="0 0 418 250" role="img" aria-label="What training adds as retries grow. 1 try: +21.3 pts, 3 tries: +14.3 pts, 5 tries: +9.6 pts, 10 tries: +3.7 pts, ~14–18 tries: +2.5 pts. Fine-tune when you can't verify; scaffold when you can.">
<style>
text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
.mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
.grow { transform-box: fill-box; transform-origin: 0 50%; animation: grow 1.1s cubic-bezier(.2,.7,.2,1) both; }
.rise { animation: rise .6s ease-out both; }
@keyframes grow { from { transform: scaleX(0); } }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs><pattern id="hatch-dark" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="3" height="6" fill="#9198a1" opacity=".6"/></pattern></defs>
<rect x="0.5" y="0.5" width="417" height="249" rx="12" fill="#151b23" stroke="#3d444d"/>
<text x="20" y="30" font-size="14" font-weight="700" fill="#f0f6fc">What training adds as retries grow</text>
<text x="20" y="48" font-size="12" fill="#9198a1">Lift over the untrained base, same verify-and-repair loop</text>

<text x="20" y="80" font-size="12.5" fill="#f0f6fc">1 try</text>
<rect x="140" y="70" width="196" height="12" rx="6" fill="#262c36"/>
<rect class="grow" x="140" y="70" width="196" height="12" rx="6" fill="#86a6ff" style="animation-delay:0.2s"/>
<text x="343" y="80" font-size="12.5" font-weight="600" fill="#f0f6fc">+21.3 pts</text>
<text x="20" y="110" font-size="12.5" fill="#f0f6fc">3 tries</text>
<rect x="140" y="100" width="196" height="12" rx="6" fill="#262c36"/>
<rect class="grow" x="140" y="100" width="131.59" height="12" rx="6" fill="#86a6ff" style="animation-delay:0.32s"/>
<text x="343" y="110" font-size="12.5" font-weight="600" fill="#f0f6fc">+14.3 pts</text>
<text x="20" y="140" font-size="12.5" fill="#f0f6fc">5 tries</text>
<rect x="140" y="130" width="196" height="12" rx="6" fill="#262c36"/>
<rect class="grow" x="140" y="130" width="88.34" height="12" rx="6" fill="#86a6ff" style="animation-delay:0.44s"/>
<text x="343" y="140" font-size="12.5" font-weight="600" fill="#f0f6fc">+9.6 pts</text>
<text x="20" y="170" font-size="12.5" fill="#f0f6fc">10 tries</text>
<rect x="140" y="160" width="196" height="12" rx="6" fill="#262c36"/>
<rect class="grow" x="140" y="160" width="34.05" height="12" rx="6" fill="#86a6ff" style="animation-delay:0.56s"/>
<text x="343" y="170" font-size="12.5" font-weight="600" fill="#f0f6fc">+3.7 pts</text>
<text x="20" y="200" font-size="12.5" fill="#f0f6fc">~14–18 tries</text>
<rect x="140" y="190" width="196" height="12" rx="6" fill="#262c36"/>
<rect class="grow" x="140" y="190" width="23" height="12" rx="6" fill="#86a6ff" style="animation-delay:0.68s"/>
<text x="343" y="200" font-size="12.5" font-weight="600" fill="#f0f6fc">+2.5 pts</text>
<text x="20" y="232" font-size="12" font-weight="700" fill="#86a6ff">Fine-tune when you can't verify; scaffold when you can.</text>
</svg>
