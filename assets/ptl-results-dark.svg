<svg xmlns="http://www.w3.org/2000/svg" width="418" height="250" viewBox="0 0 418 250" role="img" aria-label="HumanEvalFix pass@1, held-out exam. Base 1.5B, untrained: 17.6%, OctoCoder 15.5B: 30.4%, Ours, worst seed: 34.5%, Ours, 3-seed mean: 38.6%, Ours, best seed: 42.65%. Dashed line: OctoCoder's published score, the target.">
<style>
text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
.mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
.grow { transform-box: fill-box; transform-origin: 0 50%; animation: grow 1.1s cubic-bezier(.2,.7,.2,1) both; }
.rise { animation: rise .6s ease-out both; }
@keyframes grow { from { transform: scaleX(0); } }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs><pattern id="hatch-dark" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="3" height="6" fill="#9198a1" opacity=".6"/></pattern></defs>
<rect x="0.5" y="0.5" width="417" height="249" rx="12" fill="#151b23" stroke="#3d444d"/>
<text x="20" y="30" font-size="14" font-weight="700" fill="#f0f6fc">HumanEvalFix pass@1, held-out exam</text>
<text x="20" y="46" font-size="12" fill="#9198a1">OctoPack's frozen protocol · ours = fine-tuned 1.5B</text>
<line x1="290.93" y1="62" x2="290.93" y2="206" stroke="#9198a1" stroke-dasharray="3 3"/>
<text x="290.93" y="58" font-size="11" fill="#9198a1" text-anchor="middle">target</text>
<text x="20" y="80" font-size="12.5" fill="#9198a1">Base 1.5B, untrained</text>
<rect x="190" y="70" width="166" height="12" rx="6" fill="#262c36"/>
<rect class="grow" x="190" y="70" width="58.43" height="12" rx="6" fill="#9198a1" opacity=".55" style="animation-delay:0.2s"/>
<text x="363" y="80" font-size="12.5" font-weight="600" fill="#f0f6fc">17.6%</text>
<text x="20" y="110" font-size="12.5" fill="#9198a1">OctoCoder 15.5B</text>
<rect x="190" y="100" width="166" height="12" rx="6" fill="#262c36"/>
<rect class="grow" x="190" y="100" width="100.93" height="12" rx="6" fill="url(#hatch-dark)" style="animation-delay:0.32s"/>
<text x="363" y="110" font-size="12.5" font-weight="600" fill="#f0f6fc">30.4%</text>
<text x="20" y="140" font-size="12.5" fill="#f0f6fc">Ours, worst seed</text>
<rect x="190" y="130" width="166" height="12" rx="6" fill="#262c36"/>
<rect class="grow" x="190" y="130" width="114.54" height="12" rx="6" fill="#86a6ff" style="animation-delay:0.44s"/>
<text x="363" y="140" font-size="12.5" font-weight="600" fill="#f0f6fc">34.5%</text>
<text x="20" y="170" font-size="12.5" fill="#f0f6fc">Ours, 3-seed mean</text>
<rect x="190" y="160" width="166" height="12" rx="6" fill="#262c36"/>
<rect class="grow" x="190" y="160" width="128.15" height="12" rx="6" fill="#86a6ff" style="animation-delay:0.56s"/>
<text x="363" y="170" font-size="12.5" font-weight="600" fill="#f0f6fc">38.6%</text>
<text x="20" y="200" font-size="12.5" fill="#f0f6fc">Ours, best seed</text>
<rect x="190" y="190" width="166" height="12" rx="6" fill="#262c36"/>
<rect class="grow" x="190" y="190" width="141.6" height="12" rx="6" fill="#86a6ff" style="animation-delay:0.68s"/>
<text x="363" y="200" font-size="12.5" font-weight="600" fill="#f0f6fc">42.65%</text>
<text x="20" y="232" font-size="12" fill="#9198a1">Dashed line: OctoCoder's published score, the target.</text>
</svg>
