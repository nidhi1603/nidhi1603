<svg xmlns="http://www.w3.org/2000/svg" width="418" height="250" viewBox="0 0 418 250" role="img" aria-label="Six layers, each making one number trustworthy: Models (LiteLLM · gpt-5-mini · gpt-5.2), Spend admission control (reserve → refuse → settle), Benchmark, pinned (tau2-bench, hashed and sandboxed), Runtime harness (flags, each with a negative control), Evaluation layer (found the benchmark leak), Review (blind readers + adjudicator)">
<style>
text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
.mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
.grow { transform-box: fill-box; transform-origin: 0 50%; animation: grow 1.1s cubic-bezier(.2,.7,.2,1) both; }
.rise { animation: rise .6s ease-out both; }
@keyframes grow { from { transform: scaleX(0); } }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<rect x="0.5" y="0.5" width="417" height="249" rx="12" fill="#151b23" stroke="#3d444d"/>
<text x="20" y="30" font-size="14" font-weight="700" fill="#f0f6fc">Six layers, each making one number trustworthy</text>
<g class="rise" style="animation-delay:0.15s">
<rect x="20" y="44" width="378" height="27" rx="7" fill="#1b2440" stroke="none"/>
<text x="32" y="62" font-size="12.5" font-weight="700" fill="#f0f6fc">Models</text>
<text x="386" y="62" font-size="12" fill="#9198a1" text-anchor="end">LiteLLM · gpt-5-mini · gpt-5.2</text>
</g>
<g class="rise" style="animation-delay:0.27s">
<rect x="20" y="77" width="378" height="27" rx="7" fill="#1b2440" stroke="none"/>
<text x="32" y="95" font-size="12.5" font-weight="700" fill="#f0f6fc">Spend admission control</text>
<text x="386" y="95" font-size="12" fill="#9198a1" text-anchor="end">reserve → refuse → settle</text>
</g>
<g class="rise" style="animation-delay:0.39s">
<rect x="20" y="110" width="378" height="27" rx="7" fill="#1b2440" stroke="none"/>
<text x="32" y="128" font-size="12.5" font-weight="700" fill="#f0f6fc">Benchmark, pinned</text>
<text x="386" y="128" font-size="12" fill="#9198a1" text-anchor="end">tau2-bench, hashed and sandboxed</text>
</g>
<g class="rise" style="animation-delay:0.51s">
<rect x="20" y="143" width="378" height="27" rx="7" fill="#1b2440" stroke="none"/>
<text x="32" y="161" font-size="12.5" font-weight="700" fill="#f0f6fc">Runtime harness</text>
<text x="386" y="161" font-size="12" fill="#9198a1" text-anchor="end">flags, each with a negative control</text>
</g>
<g class="rise" style="animation-delay:0.63s">
<rect x="20" y="176" width="378" height="27" rx="7" fill="#2d1d10" stroke="#f0883e"/>
<text x="32" y="194" font-size="12.5" font-weight="700" fill="#f0f6fc">Evaluation layer</text>
<text x="386" y="194" font-size="12" fill="#f0883e" text-anchor="end" font-weight="600">found the benchmark leak</text>
</g>
<g class="rise" style="animation-delay:0.75s">
<rect x="20" y="209" width="378" height="27" rx="7" fill="#1b2440" stroke="none"/>
<text x="32" y="227" font-size="12.5" font-weight="700" fill="#f0f6fc">Review</text>
<text x="386" y="227" font-size="12" fill="#9198a1" text-anchor="end">blind readers + adjudicator</text>
</g>
</svg>
